spring:
  application:
    name: continuum-control
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/continuum}
    username: ${DB_USER:continuum}
    password: ${DB_PASS:continuum}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        default_schema: public
  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: public
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
  mongodb:
    uri: ${MONGO_URI:mongodb://continuum:continuum@localhost:27017/continuum?authSource=admin}
  docker:
    compose:
      enabled: false

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: continuum-control

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

continuum:
  jwt:
    secret: ${JWT_SECRET:change-me-min-32-chars-for-hs256-continuum!!}
    expiration-ms: ${JWT_EXPIRATION:86400000}
  stability:
    ttl-seconds: ${STABILITY_TTL:60}
    peso-critica: ${STABILITY_PESO_CRITICA:15}
    peso-ativa: ${STABILITY_PESO_ATIVA:5}
    peso-execucao: ${STABILITY_PESO_EXECUCAO:3}
    peso-falha-7d: ${STABILITY_PESO_FALHA:10}
    peso-severa-7d: ${STABILITY_PESO_SEVERA:8}
  seed:
    enabled: ${SEED_ENABLED:true}

logging:
  level:
    br.infnet.continuum: INFO
